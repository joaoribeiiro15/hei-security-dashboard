# ---------------------------------------------------------------
# Nginx configuration for HEI Security Dashboard
#
# HTTPS mode (active when certs/fullchain.pem + certs/privkey.pem exist):
#   - Port 80  -> permanent redirect to HTTPS
#   - Port 443 -> reverse proxy to Python backend on port 8080
#
# HTTP-only mode (no certificates):
#   - Port 80  -> reverse proxy to Python backend on port 8080
#   - Port 443 -> closed
# ---------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Increase body size limit to support large CSV uploads (default is 1MB)
    client_max_body_size 50M;

    # Upstream: Python backend
    upstream backend {
        server app:8080;
    }

    # ---------------------------------------------------------------
    # HTTP server
    # ---------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # If HTTPS certificates are present, redirect all HTTP to HTTPS.
        # Comment out this block if you want HTTP-only access.
        # To enable: ensure certs/fullchain.pem and certs/privkey.pem exist
        # and uncomment the HTTPS server block below.
        #
        # return 301 https://$host$request_uri;

        # HTTP-only: proxy directly to backend
        location / {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # ---------------------------------------------------------------
    # HTTPS server (uncomment when certificates are available)
    # ---------------------------------------------------------------
    # To activate HTTPS:
    #   1. Place your certificate files in the certs/ directory:
    #        certs/fullchain.pem  -> certificate chain (from Let's Encrypt or CA)
    #        certs/privkey.pem    -> private key
    #   2. Uncomment the server block below
    #   3. Uncomment "return 301 ..." in the HTTP server block above
    #   4. Run: docker-compose down && docker-compose up --build
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # Modern TLS only
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS (enable after confirming HTTPS works correctly)
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         proxy_pass         http://backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 120s;
    #         proxy_send_timeout 120s;
    #     }
    # }
}
